<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460" role="img" aria-labelledby="t d">
  <title id="t">Bussola's architecture</title>
  <desc id="d">A browser and a phone reach the frontend container, the only published port. The frontend proxies /api to the api container, which stores everything in the postgres container. The optional quotes container, on the same internal network, fetches ETF, ETC and crypto prices from CoinGecko, Eulerpool, Twelve Data and EODHD. Outside the compose file, an optional OpenAI-compatible model endpoint, yours or hosted, turns bank notifications into draft transactions.</desc>
  <style>
    svg { --bg:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#8c959f; --box:#f6f8fa; --edge:#d1d9e0; --blue:#1e90ff; --blue-soft:#e7f2ff; --opt:#fbfbfc; --zone:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --line:#6e7681; --box:#151b23; --edge:#3d444d; --blue:#4493f8; --blue-soft:#0f2544; --opt:#0d1117; --zone:#10151c; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .zone { fill: var(--zone); stroke: var(--edge); stroke-width: 1.5; stroke-dasharray: 2 5; }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.5; }
    .main { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; }
    .opt { fill: var(--opt); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .title { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: var(--muted); }
    .zone-label { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: .04em; }
    .edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .edge-opt { stroke: var(--line); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .label { font-size: 11.5px; fill: var(--muted); }
    .tip { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tip" d="M0 0 10 5 0 10z"/>
    </marker>
  </defs>

  <rect class="bg" width="1040" height="460"/>

  <!-- Outside the compose file -->
  <rect class="box" x="20" y="92" width="150" height="76" rx="10"/>
  <text class="title" x="95" y="126" text-anchor="middle">Browser</text>
  <text class="sub" x="95" y="148" text-anchor="middle">computer or phone</text>

  <rect class="box" x="20" y="262" width="150" height="96" rx="10"/>
  <text class="title" x="95" y="294" text-anchor="middle">Phone</text>
  <text class="sub" x="95" y="316" text-anchor="middle">bank notifications</text>
  <text class="sub" x="95" y="334" text-anchor="middle">Shortcuts · MacroDroid</text>

  <!-- The compose file -->
  <rect class="zone" x="200" y="20" width="660" height="420" rx="16"/>
  <text class="zone-label" x="222" y="46">DOCKER COMPOSE · ONE INTERNAL NETWORK</text>

  <rect class="main" x="230" y="170" width="170" height="104" rx="12"/>
  <text class="title" x="315" y="206" text-anchor="middle">frontend</text>
  <text class="sub" x="315" y="228" text-anchor="middle">nginx · React app</text>
  <text class="sub" x="315" y="248" text-anchor="middle">:3000, the only open port</text>

  <rect class="main" x="450" y="170" width="170" height="104" rx="12"/>
  <text class="title" x="535" y="206" text-anchor="middle">api</text>
  <text class="sub" x="535" y="228" text-anchor="middle">Express · Node</text>
  <text class="sub" x="535" y="248" text-anchor="middle">sessions, rules, inbox</text>

  <rect class="main" x="690" y="60" width="160" height="92" rx="12"/>
  <text class="title" x="770" y="96" text-anchor="middle">postgres</text>
  <text class="sub" x="770" y="118" text-anchor="middle">PostgreSQL 16</text>
  <text class="sub" x="770" y="136" text-anchor="middle">row-level security</text>

  <rect class="opt" x="690" y="186" width="160" height="92" rx="12"/>
  <text class="title" x="770" y="220" text-anchor="middle">quotes</text>
  <text class="sub" x="770" y="242" text-anchor="middle">ETF and crypto prices</text>
  <text class="sub" x="770" y="260" text-anchor="middle">optional · profile quotes</text>

  <!-- On the internet -->
  <rect class="box" x="885" y="176" width="135" height="112" rx="10"/>
  <text class="title" x="952" y="202" text-anchor="middle">Internet</text>
  <text class="sub" x="952" y="224" text-anchor="middle">CoinGecko</text>
  <text class="sub" x="952" y="240" text-anchor="middle">Eulerpool</text>
  <text class="sub" x="952" y="256" text-anchor="middle">Twelve Data</text>
  <text class="sub" x="952" y="272" text-anchor="middle">EODHD</text>

  <rect class="opt" x="885" y="312" width="135" height="92" rx="10"/>
  <text class="title" x="952" y="344" text-anchor="middle">Your model</text>
  <text class="sub" x="952" y="366" text-anchor="middle">OpenAI-compatible</text>
  <text class="sub" x="952" y="384" text-anchor="middle">optional</text>

  <!-- Edges -->
  <path class="edge" d="M170 130 C200 130 205 205 228 205" marker-end="url(#a)"/>
  <text class="label" x="178" y="118">HTTPS</text>

  <path class="edge" d="M170 310 C200 310 205 245 228 245" marker-end="url(#a)"/>
  <text class="label" x="176" y="378">POST /api/inbox</text>
  <text class="label" x="176" y="393">with a token</text>

  <path class="edge" d="M400 222 H448" marker-end="url(#a)"/>
  <text class="label" x="424" y="212" text-anchor="middle">/api</text>

  <path class="edge" d="M620 196 C655 196 655 106 688 106" marker-end="url(#a)"/>
  <text class="label" x="636" y="150" text-anchor="start">SQL</text>

  <path class="edge-opt" d="M620 232 H688" marker-end="url(#a)"/>
  <text class="label" x="654" y="224" text-anchor="middle">/v1/quote</text>

  <path class="edge-opt" d="M620 256 C655 256 655 358 883 358" marker-end="url(#a)"/>
  <text class="label" x="634" y="318" text-anchor="start">JSON</text>

  <path class="edge-opt" d="M850 232 H883" marker-end="url(#a)"/>
</svg>
