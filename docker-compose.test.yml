# A throwaway instance for api/test/isolation.js and api/test/security.js --
# the one CI runs, and one you can run next to your real stack:
#
#   docker compose -p bussola-test -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
#   BASE_URL=http://localhost:3100 node api/test/isolation.js
#   BASE_URL=http://localhost:3100 ADMIN_USER=bussola ADMIN_PASS=test-admin-pass node api/test/security.js
#   docker compose -p bussola-test -f docker-compose.yml -f docker-compose.test.yml down -v
#
# Everything the tests need is set here rather than read from .env, so the
# instance never shares a credential, a container, an image tag or a volume
# with the real one (`-p bussola-test` keeps the volume apart): open sign-up,
# a 3-second first lock so security.js can wait out the doubling, and passkeys
# on at http://localhost:3100 so isolation.js runs both ceremonies.
services:
  api:
    image: bussola-test-api
    container_name: bussola-test-api
    environment:
      PGUSER: bussola
      PGPASSWORD: bussola-test
      PGDATABASE: bussola
      BUSSOLA_AUTH_USER: bussola
      BUSSOLA_AUTH_PASS: test-admin-pass
      BUSSOLA_SIGNUP: open
      BUSSOLA_LOCKOUT_SECONDS: 3
      BUSSOLA_PUBLIC_URL: http://localhost:3100
      SNAPSHOT_CRON: "off"
      # The rest of what docker-compose.yml would otherwise take from .env,
      # pinned so a real instance's settings never leak into the tests.
      BUSSOLA_DEFAULT_LOCALE: en
      BUSSOLA_COOKIE_SECURE: ""
      BUSSOLA_SESSION_DAYS: ""
      BUSSOLA_TRUSTED_PROXIES: 1
      CORS_ORIGINS: ""
      # No quotes service: the refresh endpoints answer QUOTES_DISABLED, which
      # is what isolation.js and the demo comparison expect.
      BUSSOLA_QUOTES_URL: ""
      # No model either: notifications are stored as they came (extraction
      # "off"), which is what isolation.js and the demo comparison expect.
      BUSSOLA_AI_URL: ""

  frontend:
    image: bussola-test-frontend
    container_name: bussola-test-frontend
    ports: !override
      - "3100:80"

  # The api above never calls it (no BUSSOLA_QUOTES_URL), so it is never
  # started, whatever COMPOSE_PROFILES says in .env.
  quotes:
    profiles: !override ["never"]

  postgres:
    container_name: bussola-test-postgres
    environment:
      POSTGRES_DB: bussola
      POSTGRES_USER: bussola
      POSTGRES_PASSWORD: bussola-test
